# Mimics GitHub Pages for the static export (see Dockerfile.pages).
server {
    listen 80;
    root /usr/share/nginx/html;
    # Relative redirects, so they keep the host port mapping (e.g. :8080).
    absolute_redirect off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    location = / {
        return 302 /NCEA-2-ATAR/;
    }

    location /NCEA-2-ATAR/ {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /NCEA-2-ATAR/404.html;
}
