services:
  # Postgres Database
  database:
    image: postgres:15-alpine
    container_name: ncea-database-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ncea_atar}
      POSTGRES_USER: ${DB_USER:-ncea_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ncea_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/02-standards-data.sql:/docker-entrypoint-initdb.d/02-standards-data.sql:ro
      - ./database/03-standard-weightings-data.sql:/docker-entrypoint-initdb.d/03-standard-weightings-data.sql:ro
      - ./database/04-atar-distributions-data.sql:/docker-entrypoint-initdb.d/04-atar-distributions-data.sql:ro
      - ./database/05-participation-rates-data.sql:/docker-entrypoint-initdb.d/05-participation-rates-data.sql:ro
      - ./database/06-alter-tables.sql:/docker-entrypoint-initdb.d/06-alter-tables.sql:ro
      - ./database/07-atar-map.sql:/docker-entrypoint-initdb.d/07-atar-map.sql:ro
    networks:
      - ncea-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-ncea_user}", "-d", "${DB_NAME:-ncea_atar}"]
      timeout: 20s
      retries: 10

  # FastAPI Backend (Development with hot reloading)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ncea-backend-dev
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ncea_atar}
      DB_USER: ${DB_USER:-ncea_user}
      DB_PASSWORD: ${DB_PASSWORD:-ncea_password}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ncea-network
    volumes:
      - ./backend:/app
      - backend_cache:/app/__pycache__
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

  # Next.js Frontend (Development with hot reloading)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ncea-frontend-dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ncea-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data_dev:
    driver: local
  backend_cache:
    driver: local

networks:
  ncea-network:
    driver: bridge