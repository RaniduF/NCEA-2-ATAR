# Rate limiting zone: 10 requests/minute per IP, 10MB shared memory
limit_req_zone $binary_remote_addr zone=atar_calc:10m rate=10r/m;

# Generic 429 error page
limit_req_status 429;

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------
    # ATAR calculation endpoint — rate limited
    # ---------------------------------------------------------------
    location /api/v1/calculate-atar/ {
        limit_req zone=atar_calc burst=5 nodelay;

        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------
    # All other /api/ traffic — no rate limit
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------
    # Everything else — Next.js frontend
    # ---------------------------------------------------------------
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for Next.js hot-reload WebSocket in dev
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
